[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demoforge"
version = "0.3.0"
description = "Local video creation: demos, presenter cuts, edited talks, reels and shorts, on your machine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sarthak Karandikar" }]
keywords = ["demo", "video", "screencast", "text-to-speech", "lip-sync", "voice-cloning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

# The recorder half needs Pillow and ffmpeg on PATH, nothing else. Everything
# heavier is an extra, so cloning this to re-render one segment does not pull a
# GPU stack down with it.
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# The window. Small, pure-Python, and enough for Short mode on its own.
app = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "pywebview>=5"]
# Editor and Reel read speech and, for Reel, the eye line.
speech = ["openai-whisper>=20240930", "python-pptx>=1.0", "mediapipe>=0.10",
          "librosa>=0.10", "numpy<2.3"]
browser = ["playwright>=1.40"]
voice = ["chatterbox-tts>=0.1.7"]
# Generated b-roll: LTX-Video through diffusers, with the T5 encoder read
# from a GGUF file. `sentencepiece` is what lets transformers read the T5
# vocabulary; without it the tokenizer falls back to a parser that cannot.
broll = ["diffusers>=0.32", "transformers>=4.48", "sentencepiece>=0.2", "gguf>=0.10", "accelerate>=1.0",
         "imageio[ffmpeg]>=2.34"]
plan = []
all = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "pywebview>=5",
       "openai-whisper>=20240930", "python-pptx>=1.0", "mediapipe>=0.10",
       "librosa>=0.10", "numpy<2.3", "playwright>=1.40", "chatterbox-tts>=0.1.7",
       "diffusers>=0.32", "transformers>=4.48", "sentencepiece>=0.2", "gguf>=0.10", "accelerate>=1.0",
       "imageio[ffmpeg]>=2.34"]

[project.scripts]
demoforge = "demoforge.cli:main"

[project.urls]
Homepage = "https://github.com/itsskofficial/demoforge"
Issues = "https://github.com/itsskofficial/demoforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"demoforge.app" = ["static/*"]
"demoforge.film" = ["kit/*", "kit/fonts/*"]

[tool.ruff]
line-length = 100
