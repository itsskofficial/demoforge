<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demoforge</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <a class="brand" href="#/">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>demoforge</span>
    </a>
    <a class="new" href="#/new">
      <svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      New video
    </a>
    <a class="tools-link" href="#/tools" data-nav="tools">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h5v5H4zM11 4h5v5h-5zM4 11h5v5H4zM11 11h5v5h-5z"/></svg>
      Tools
    </a>
    <nav id="projects"></nav>
    <div class="side-foot">
      <a href="#/settings" data-nav="settings">Settings</a>
      <a href="#/doctor" data-nav="doctor">Doctor <span id="doctor-badge" class="badge" hidden></span></a>
      <span id="version" class="muted"></span>
    </div>
  </aside>
  <main id="main"></main>
  <section id="dock" class="dock" hidden>
    <div class="dock-bar">
      <span class="dot"></span>
      <span id="dock-title"></span>
      <span id="dock-phase" class="muted"></span>
      <span id="dock-time" class="muted mono"></span>
      <span class="spacer"></span>
      <button id="dock-cancel" class="btn ghost small">Stop</button>
      <button id="dock-toggle" class="btn ghost small">Log</button>
    </div>
    <pre id="dock-log" class="log" hidden></pre>
  </section>
  <div id="toasts"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
